<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Delivery Command</title>

  <!-- PWA Manifest & Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Core Libraries: Local first with CDN fallback -->
  <script src="xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Firebase Compat SDKs for Real-Time Cloud Sync -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155; --accent: #38bdf8;
      --primary: #2563eb; --success: #16a34a; --warning: #f59e0b; --danger: #ef4444;
      --text: #f8fafc; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }
    header { background: #111827; padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 40; }
    header h1 { font-size: 1.1rem; font-weight: 600; color: var(--text); }
    header span { font-size: 0.8rem; color: var(--accent); }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    .toolbar button { flex: 1; padding: 10px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; }
    .btn-export { background: #0284c7; color: #fff; border-color: var(--accent); }
    .btn-clear { background: #334155; color: #cbd5e1; }
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111827; display: flex; border-top: 1px solid var(--border); z-index: 50; }
    .nav-btn { flex: 1; padding: 14px; text-align: center; color: var(--muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; background: none; }
    .nav-btn.active { color: var(--accent); border-top: 2px solid var(--accent); }
    .screen { display: none; padding: 16px; max-width: 650px; margin: 0 auto; }
    .screen.active { display: block !important; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .upload-zone { border: 2px dashed var(--accent); border-radius: 8px; padding: 16px; text-align: center; margin-bottom: 16px; background: rgba(56, 189, 248, 0.05); cursor: pointer; }
    .upload-zone input { display: none; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
    input, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.95rem; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .dims-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .badge-pending { background: #78350f; color: #fde68a; }
    .badge-intransit { background: #1e3a8a; color: #93c5fd; }
    .badge-delivered { background: #14532d; color: #86efac; }
    .badge-oversize { background: #7f1d1d; color: #fecaca; border: 1px solid var(--danger); margin-top: 6px; }
    .alert { padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; margin-top: 10px; display: none; }
    .alert-danger { background: rgba(220, 38, 38, 0.2); color: #fca5a5; border: 1px solid var(--danger); }
    .alert-success { background: rgba(22, 163, 74, 0.2); color: #86efac; border: 1px solid var(--success); }
    .btn { display: block; width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; background: var(--accent); color: #0f172a; font-size: 0.95rem; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    canvas { background: #ffffff; border-radius: 6px; width: 100%; height: 150px; touch-action: none; cursor: crosshair; }
    .preview-img { max-width: 100%; max-height: 180px; border-radius: 6px; display: none; margin-top: 8px; border: 1px solid var(--border); }
    .pod-thumbnails { display: flex; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
    .pod-thumbnails img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); background: #000; }
  </style>
</head>
<body>
  <header>
    <h1>Delivery Command</h1>
    <span>super-delivery • Cloud Sync</span>
  </header>

  <!-- Screen 1: Active Queue -->
  <section id="screen-queue" class="screen active">
    <div class="toolbar">
      <button class="btn-export" onclick="exportDailyManifest()">📊 Export Daily Manifest</button>
      <button class="btn-clear" onclick="openRestore()">↩️ Restore (<span id="tCnt">0</span>)</button><button class="btn-clear" onclick="clearCompletedDeliveries()">🗑️ Clear Completed</button>
    </div>
    <div id="orders-list"></div>
  </section>

  <!-- Screen 2: Intake Form -->
  <section id="screen-intake" class="screen">
    <div class="card">
      <h2 style="font-size: 1.1rem; margin-bottom: 12px; color: var(--accent);">Book Delivery Order</h2>
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <strong>Upload Slip (PDF, XLSX, CSV)</strong>
        <p style="margin: 4px 0 0; font-size: 0.8rem; color: var(--muted);">Auto-extracts PO#, Customer, & Dimensions</p>
        <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.csv" onchange="handleFileUpload(event)">
      </div>
      <form id="deliveryForm" onsubmit="event.preventDefault(); handleAddOrder();">
        <label>PO / Invoice Number</label>
        <input type="text" id="poNumber" placeholder="PO-1001" required>
        <label>Customer / Destination Name</label>
        <input type="text" id="customerName" placeholder="Client Name" required>
        <label>Delivery Address</label>
        <input type="text" id="deliveryAddress" placeholder="Street, City, State, ZIP" required>
        <label>Cargo Dimensions (Inches)</label>
        <div class="dims-grid">
          <input type="number" id="dimL" placeholder="L (68 max)" step="any" oninput="auditIoniqLimits()" required>
          <input type="number" id="dimW" placeholder="W (41 max)" step="any" oninput="auditIoniqLimits()" required>
          <input type="number" id="dimH" placeholder="H (26 max)" step="any" oninput="auditIoniqLimits()" required>
        </div>
        <div id="dimAlert" class="alert alert-danger">
          ⚠️ OVERSIZE / EXCEEDS IONIQ 5 CAPACITY (Max: 68"L × 41"W × 26"H, 59.3 cu ft)
        </div>
        <label>Special Instructions / Notes</label>
        <textarea id="itemsDesc" rows="2" placeholder="Gate codes, handling notes..."></textarea>
        <button type="submit" class="btn">Save to Dispatch Queue</button>
      </form>
      <div id="intakeAlert" class="alert alert-success"></div>
    </div>
  </section>

  <!-- Screen 3: Proof of Delivery (POD) Modal -->
  <section id="screen-pod" class="screen">
    <div class="card">
      <h2 style="font-size: 1.1rem; margin-bottom: 8px; color: var(--accent);">Proof of Delivery (POD)</h2>
      <div id="podOrderSummary" style="font-size: 0.85rem; color: var(--muted); margin-bottom: 12px;"></div>
      <label>1. Photo of Delivered Cargo</label>
      <button type="button" class="btn btn-secondary" onclick="document.getElementById('podPhoto').click()">📷 Take Photo</button>
      <input type="file" id="podPhoto" accept="image/*" capture="environment" style="display:none;" onchange="handlePhotoCapture(event)">
      <img id="photoPreview" class="preview-img" alt="POD Preview" />
      <label>2. Customer Signature</label>
      <canvas id="sigCanvas"></canvas>
      <button type="button" class="btn btn-secondary" style="padding: 6px; font-size: 0.8rem;" onclick="clearSignature()">Clear Signature</button>
      <label>3. Received By (Print Name)</label>
      <input type="text" id="signerName" placeholder="Receiver Name">
      <button type="button" class="btn btn-success" onclick="finalizeDelivery()">Confirm & Finalize Delivery</button>
      <button type="button" class="btn btn-secondary" onclick="switchTab('screen-queue')">Cancel</button>
    </div>
  </section>

  <!-- Bottom Navigation -->
  <nav class="nav-bar">
    <button class="nav-btn active" id="btn-queue" onclick="switchTab('screen-queue')">Active Queue</button>
    <button class="nav-btn" id="btn-intake" onclick="switchTab('screen-intake')">+ Add Intake</button>
  </nav>

  <script>
    // --- 1. FIREBASE INITIALIZATION & OFFLINE PERSISTENCE ---
    const firebaseConfig = {
      apiKey: "AIzaSyCes7q2ekpluK_QBpcDPb6iaIxljDQZ5dY",
      authDomain: "borray-delivery-dispatch.firebaseapp.com",
      projectId: "borray-delivery-dispatch",
      storageBucket: "borray-delivery-dispatch.firebasestorage.app",
      messagingSenderId: "385282448736",
      appId: "1:385282448736:web:a8e60e605c20c0a7229205",
      measurementId: "G-N1TG2E7RMB"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Enable offline persistence so cards stay loaded without cell reception
    db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
      console.warn("Firestore offline persistence notice:", err.code);
    });

    const IONIQ5_LIMITS = { maxL: 68, maxW: 41, maxH: 26, maxCuFt: 59.3 };
    let currentOrders = [];
    let activePodOrderId = null;
    let compressedPhotoData = null;

    function resolvePdfLib() {
      if (window.pdfjsLib) return window.pdfjsLib;
      if (window['pdfjs-dist/build/pdf']) return window['pdfjs-dist/build/pdf'];
      if (window.PDFJS) return window.PDFJS;
      return null;
    }

    // --- 2. GLOBAL NAVIGATION & EXPORT ---
    window.switchTab = function(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(screenId);
      if (target) target.classList.add('active');

      if (screenId === 'screen-queue') {
        const b = document.getElementById('btn-queue');
        if (b) b.classList.add('active');
      } else if (screenId === 'screen-intake') {
        const b = document.getElementById('btn-intake');
        if (b) b.classList.add('active');
      }
    };

    window.exportDailyManifest = function() {
      if (!currentOrders || currentOrders.length === 0) {
        alert("No orders in queue to export.");
        return;
      }
      const rows = currentOrders.map(ord => ({
        "PO / Invoice #": ord.poNumber,
        "Customer": ord.customer,
        "Destination Address": ord.destination,
        "Dimensions": ord.length + '" × ' + ord.width + '" × ' + ord.height + '"',
        "Cubic Feet": ord.cubicFt,
        "Status": ord.status,
        "Signer Name": ord.signerName || "N/A",
        "Delivered Timestamp": ord.deliveredAt ? new Date(ord.deliveredAt).toLocaleString() : "N/A"
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Dispatch Manifest");
      const today = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, "delivery-manifest-" + today + ".xlsx");
    };

    window.clearCompletedDeliveries = async function() {
      if (!confirm("Archive all completed deliveries? This will clear them from the live queue.")) return;
      const batch = db.batch();
      currentOrders.forEach(ord => {
        if (ord.status === 'Delivered') {
          const docRef = db.collection('orders').doc(ord.id);
          batch.delete(docRef);
        }
      });
      await batch.commit();
    };

    // --- 3. VEHICLE LIMITS & AUDITING ---
    function checkIsOversize(l, w, h) {
      const cuFt = (l * w * h) / 1728;
      return (l > IONIQ5_LIMITS.maxL || w > IONIQ5_LIMITS.maxW || h > IONIQ5_LIMITS.maxH || cuFt > IONIQ5_LIMITS.maxCuFt);
    }

    window.auditIoniqLimits = function() {
      const l = parseFloat(document.getElementById('dimL').value) || 0;
      const w = parseFloat(document.getElementById('dimW').value) || 0;
      const h = parseFloat(document.getElementById('dimH').value) || 0;
      const alertBox = document.getElementById('dimAlert');
      if (!l && !w && !h) {
        alertBox.style.display = 'none';
        return false;
      }
      const isOver = checkIsOversize(l, w, h);
      alertBox.style.display = isOver ? 'block' : 'none';
      return isOver;
    };

    // --- 4. PARSER & INTAKE ---
    window.handleFileUpload = async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const nameLower = file.name.toLowerCase();

      if (file.type === "application/pdf" || nameLower.endsWith('.pdf')) {
        let pdfLib = resolvePdfLib();
        if (!pdfLib) {
          await new Promise(r => setTimeout(r, 300));
          pdfLib = resolvePdfLib();
        }
        if (!pdfLib) {
          alert("PDF library is loading. Please tap Choose File again in 2 seconds.");
          return;
        }
        if (!pdfLib.GlobalWorkerOptions.workerSrc) {
          pdfLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
        }
        try {
          const buf = await file.arrayBuffer();
          const loadingTask = pdfLib.getDocument({ data: new Uint8Array(buf) });
          const pdf = await loadingTask.promise;
          let fullText = "";
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(it => it.str).join(" ") + " ";
          }
          extractFieldsFromText(fullText, file.name);
        } catch (err) {
          alert("Error parsing PDF: " + err.message);
        }
      } else if (nameLower.endsWith('.xlsx') || nameLower.endsWith('.xls') || nameLower.endsWith('.csv')) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const txt = XLSX.utils.sheet_to_txt(ws);
            extractFieldsFromText(txt, file.name);
          } catch (err) {
            alert("Error parsing spreadsheet: " + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      }
    };

    function extractFieldsFromText(text, filename) {
      let invMatch = text.match(/Invoice\s*([0-9]+(?:-[0-9]+)?)/i);
      let poMatch = text.match(/(?:P\.O\.?\s*NUMBER|PO|P\.O\.|Order)[\s#:*-]+([A-Za-z0-9-]+)/i);
      let finalPO = '';
      if (invMatch) {
        finalPO = invMatch[1].trim();
      } else if (poMatch && poMatch[1].trim().toUpperCase() !== 'NUMBER') {
        finalPO = poMatch[1].trim();
      } else {
        const fnMatch = filename.match(/^([0-9]{5,})/);
        finalPO = fnMatch ? fnMatch[1] : 'PO-' + Date.now().toString().slice(-6);
      }

      let customerName = '';
      let deliveryAddress = '';

      const billToMatch = text.match(/BILL\s*TO[\s:]+([\s\S]+?)(?=\s+DATE|\s+PLEASE\s+PAY|\s+DUE\s+DATE|\s+CUSTOM|$)/i);
      if (billToMatch) {
        let block = billToMatch[1].trim();
        const addrRegex = /([0-9]+\s+[A-Za-z0-9\s,\.]+?(?:ROAD|RD|STREET|ST|AVE|AVENUE|BLVD|BOULEVARD|DR|DRIVE|LN|LANE|WAY|CT|COURT)[\s\S]*?[0-9]{5}(?:-[0-9]{4})?)/i;
        const addrFound = block.match(addrRegex);

        if (addrFound) {
          deliveryAddress = addrFound[1].replace(/\s+/g, ' ').trim();
          let beforeAddr = block.substring(0, addrFound.index).trim();
          customerName = beforeAddr.replace(/\s+/g, ' ').trim();
        } else {
          let parts = block.split(/\s{2,}/);
          customerName = parts[0] || '';
          deliveryAddress = parts.slice(1).join(' ').trim();
        }
      }

      if (!deliveryAddress) {
        const fallbackAddr = text.match(/([0-9]+\s+[A-Za-z0-9\s,\.]+?(?:ROAD|RD|STREET|ST|AVE|AVENUE|BLVD|DR|LN|WAY)[\s\S]*?[0-9]{5})/i);
        if (fallbackAddr) deliveryAddress = fallbackAddr[1].replace(/\s+/g, ' ').trim();
      }

      let dimL = '', dimW = '', dimH = '';
      const dim3D = text.match(/(\d+(?:\.\d+)?)\s*["”]?\s*[xX*by\s]+\s*(\d+(?:\.\d+)?)\s*["”]?\s*[xX*by\s]+\s*(\d+(?:\.\d+)?)/i);
      const dim2D = text.match(/(\d+(?:\.\d+)?)\s*["”]?\s*[xX*by\s]+\s*(\d+(?:\.\d+)?)\s*["”]?/i);

      if (dim3D) {
        dimL = dim3D[1]; dimW = dim3D[2]; dimH = dim3D[3];
      } else if (dim2D) {
        dimL = dim2D[1]; dimW = dim2D[2]; dimH = '12';
      }

      if (document.getElementById('poNumber')) document.getElementById('poNumber').value = finalPO;
      if (document.getElementById('customerName')) document.getElementById('customerName').value = customerName;
      if (document.getElementById('deliveryAddress')) document.getElementById('deliveryAddress').value = deliveryAddress;
      if (document.getElementById('dimL')) document.getElementById('dimL').value = dimL;
      if (document.getElementById('dimW')) document.getElementById('dimW').value = dimW;
      if (document.getElementById('dimH')) document.getElementById('dimH').value = dimH;

      document.getElementById('itemsDesc').value = "Auto-filled from: " + filename;
      auditIoniqLimits();
    }

    window.handleAddOrder = async function() {
      const l = parseFloat(document.getElementById('dimL').value) || 0;
      const w = parseFloat(document.getElementById('dimW').value) || 0;
      const h = parseFloat(document.getElementById('dimH').value) || 0;
      const cuFt = ((l * w * h) / 1728).toFixed(1);
      const orderId = 'ord_' + Date.now();

      const newOrder = {
        id: orderId,
        poNumber: document.getElementById('poNumber').value.trim(),
        customer: document.getElementById('customerName').value.trim(),
        destination: document.getElementById('deliveryAddress').value.trim(),
        length: l,
        width: w,
        height: h,
        cubicFt: cuFt,
        isOversize: checkIsOversize(l, w, h),
        status: 'Pending',
        photoData: null,
        signatureData: null,
        signerName: '',
        deliveredAt: null,
        notes: document.getElementById('itemsDesc').value.trim(),
        createdAt: new Date().toISOString()
      };

      // Push to Firestore Cloud (syncs to phone automatically)
      await db.collection('orders').doc(orderId).set(newOrder);

      document.getElementById('deliveryForm').reset();
      document.getElementById('dimAlert').style.display = 'none';

      const alertBox = document.getElementById('intakeAlert');
      alertBox.textContent = "Order " + newOrder.poNumber + " synced to dispatch queue.";
      alertBox.style.display = 'block';

      setTimeout(() => {
        alertBox.style.display = 'none';
        switchTab('screen-queue');
      }, 500);
    };

    // --- 5. REAL-TIME CLOUD LISTENER & QUEUE RENDER ---
    window.updateOrderStatus = async function(orderId, newStatus) {
      await db.collection('orders').doc(orderId).update({ status: newStatus });
    };

    function listenToDispatchQueue() {
      db.collection('orders').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
        currentOrders = [];
        snapshot.forEach(doc => currentOrders.push(doc.data()));

        const listEl = document.getElementById('orders-list');
        if (!currentOrders || currentOrders.length === 0) {
          listEl.innerHTML = '<div class="card" style="text-align: center; color: var(--muted);">No orders in queue yet. Tap "+ Add Intake" to log one.</div>';
          return;
        }

        listEl.innerHTML = currentOrders.map(order => {
          let actionButtons = '';
          const normalizedStatus = order.status.replace(/\s+/g, '').toLowerCase();

          if (order.status === 'Pending') {
            actionButtons = '<button class="btn btn-primary" onclick="updateOrderStatus(\'' + order.id + '\', \'In Transit\')">Start Run</button>';
          } else if (order.status === 'In Transit') {
            actionButtons = '<button class="btn btn-success" onclick="openPodModal(\'' + order.id + '\')">POD Sign-off</button>';
          } else if (order.status === 'Delivered') {
            actionButtons = '<button class="btn btn-secondary" disabled style="cursor:default;">Delivered ✓</button>';
          }

          let thumbnailsHtml = '';
          if (order.status === 'Delivered' && (order.photoData || order.signatureData)) {
            thumbnailsHtml = 
              '<div class="pod-thumbnails">' +
                (order.photoData ? '<img src="' + order.photoData + '" alt="POD Photo" />' : '') +
                (order.signatureData ? '<img src="' + order.signatureData + '" alt="Signature" style="background:#fff;" />' : '') +
                '<div style="font-size:0.75rem; color:var(--muted); align-self:center;">' +
                  'Signed by: <strong>' + (order.signerName || 'N/A') + '</strong><br>' +
                  new Date(order.deliveredAt).toLocaleTimeString() +
                '</div>' +
              '</div>';
          }

          return (
            '<div class="card">' +
              '<div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:6px;">' +
                '<strong style="font-size:1.05rem;">' + order.poNumber + '</strong>' +
                '<span class="badge badge-' + normalizedStatus + '">' + order.status + '</span>' +
              '</div>' +
              '<div style="color:var(--accent); font-weight:500; font-size:0.9rem;">' + order.customer + '</div>' +
              '<p style="font-size:0.85rem; color:var(--text); margin-top:4px;">📍 ' + order.destination + '</p>' +
              '<p style="font-size:0.8rem; color:var(--muted); margin-top:4px;">' +
                order.length + '"L × ' + order.width + '"W × ' + order.height + '"H (' + order.cubicFt + ' cu ft)' +
              '</p>' +
              (order.isOversize ? '<span class="badge badge-oversize">⚠️ OVERSIZE / EXCEEDS IONIQ 5 CAPACITY</span>' : '') +
              '<div style="display:flex; gap:8px; margin-top:10px;">' +
                '<a href="https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(order.destination) + '" target="_blank" class="btn btn-secondary" style="margin-top:0; text-decoration:none;">Navigate</a>' + '<button type="button" class="btn btn-secondary" style="margin-top:0;color:#ef4444;border-color:#ef4444;padding:6px 10px;" onclick="delOrd(' + JSON.stringify(order.id) + ')">🗑️</button>' +
                '<div style="flex:1;">' + actionButtons + '</div>' +
              '</div>' +
              thumbnailsHtml +
            '</div>'
          );
        }).join('');
      }, (error) => {
        console.error("Firestore sync error:", error);
      });
    }

    // --- 6. CAMERA COMPRESSION & TOUCH SIGNATURE ---
    window.handlePhotoCapture = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const c = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxW = 800;
          if (width > maxW) {
            height = Math.round((height * maxW) / width);
            width = maxW;
          }
          c.width = width;
          c.height = height;
          const cx = c.getContext('2d');
          cx.drawImage(img, 0, 0, width, height);
          compressedPhotoData = c.toDataURL('image/jpeg', 0.70);
          const preview = document.getElementById('photoPreview');
          preview.src = compressedPhotoData;
          preview.style.display = 'block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    const canvas = document.getElementById('sigCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000000';
    }

    window.clearSignature = function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const coords = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(coords.x, coords.y);
    });
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const coords = getCoords(e);
      ctx.lineTo(coords.x, coords.y);
      ctx.stroke();
    });
    ['mouseup', 'mouseleave'].forEach(ev => canvas.addEventListener(ev, () => isDrawing = false));

    canvas.addEventListener('touchstart', (e) => {
      isDrawing = true;
      const coords = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(coords.x, coords.y);
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!isDrawing) return;
      const coords = getCoords(e);
      ctx.lineTo(coords.x, coords.y);
      ctx.stroke();
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', () => isDrawing = false);

    window.openPodModal = function(orderId) {
      activePodOrderId = orderId;
      compressedPhotoData = null;
      document.getElementById('photoPreview').style.display = 'none';
      document.getElementById('signerName').value = '';
      clearSignature();
      const order = currentOrders.find(o => o.id === orderId);
      if (order) {
        document.getElementById('podOrderSummary').innerHTML = 
          '<strong>PO:</strong> ' + order.poNumber + ' — ' + order.customer + '<br>' +
          '📍 ' + order.destination;
      }
      switchTab('screen-pod');
      setTimeout(resizeCanvas, 60);
    };

    window.finalizeDelivery = async function() {
      const signer = document.getElementById('signerName').value.trim();
      if (!signer) {
        alert("Please enter receiver name.");
        return;
      }
      await db.collection('orders').doc(activePodOrderId).update({
        status: 'Delivered',
        signerName: signer,
        photoData: compressedPhotoData,
        signatureData: canvas.toDataURL('image/png'),
        deliveredAt: new Date().toISOString()
      });
      activePodOrderId = null;
      switchTab('screen-queue');
    };

    window.delOrd = async function(orderId) {
      if (!orderId) return;
      if (!confirm("Delete this order permanently?")) return;
      try {
        await db.collection('orders').doc(orderId).delete();
      } catch (err) {
        alert("Error deleting order: " + err.message);
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      listenToDispatchQueue();
    });
  </script>
<script src="trash.js"></script></body>
</html>
