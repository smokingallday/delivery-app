<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispatch Command | Home Base</title>

  <!-- Core Libraries -->
  <script src="xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Firebase Cloud Sync -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #0b1329; --sidebar: #111e38; --card: #17264a; --border: #293b66;
      --accent: #38bdf8; --primary: #2563eb; --success: #16a34a; --warning: #f59e0b;
      --danger: #ef4444; --text: #f8fafc; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header {
      background: #090e1f;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    header .status-pill {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .main-layout { display: grid; grid-template-columns: 420px 1fr; flex: 1; height: calc(100vh - 65px); }

    /* Left Panel: Intake */
    .sidebar-intake {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
    }
    .sidebar-intake h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--accent); display: flex; align-items: center; gap: 8px; }

    .upload-zone {
      border: 2px dashed var(--accent);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 18px;
      background: rgba(56, 189, 248, 0.05);
      cursor: pointer;
      transition: background 0.2s;
    }
    .upload-zone:hover { background: rgba(56, 189, 248, 0.1); }
    .upload-zone input { display: none; }

    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; margin-top: 12px; text-transform: uppercase; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: #090e1f;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .dims-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      background: var(--accent);
      color: #0b1329;
      font-size: 0.95rem;
      transition: filter 0.2s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-export { background: #0284c7; color: #fff; width: auto; padding: 8px 16px; margin: 0; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-pdf-all { background: #16a34a; color: #fff; width: auto; padding: 8px 16px; margin: 0; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-clear { background: #334155; color: #cbd5e1; width: auto; padding: 8px 16px; margin: 0; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }

    .alert { padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; margin-top: 12px; display: none; }
    .alert-danger { background: rgba(220, 38, 38, 0.2); color: #fca5a5; border: 1px solid var(--danger); }
    .alert-success { background: rgba(22, 163, 74, 0.2); color: #86efac; border: 1px solid var(--success); }

    /* Right Panel: Live Fleet Queue */
    .content-queue { padding: 24px 32px; overflow-y: auto; }
    .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .queue-title { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }

    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .order-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .order-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-pending { background: #78350f; color: #fde68a; }
    .badge-intransit { background: #1e3a8a; color: #93c5fd; }
    .badge-delivered { background: #14532d; color: #86efac; }
    .badge-oversize { background: #7f1d1d; color: #fecaca; border: 1px solid var(--danger); margin-top: 6px; font-size: 0.7rem; }

    .pod-box {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .pod-box img { width: 55px; height: 55px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); }

    .card-actions {
      margin-top: 12px;
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-preview { background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8; }
    .btn-download-pdf { background: #14532d; color: #86efac; border: 1px solid #16a34a; }
    .btn-delete { background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; }
  </style>
</head>
<body>
  <header>
    <h1>Borray Dispatch Command</h1>
    <div class="status-pill">● Live Fleet Sync Connected</div>
  </header>

  <div class="main-layout">
    <!-- Left Section: Intake Desk -->
    <aside class="sidebar-intake">
      <h2>📝 Book New Delivery</h2>

      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <strong>Upload Packing Slip / Invoice</strong>
        <p style="font-size: 0.8rem; color: var(--muted); margin-top: 4px;">PDF, XLSX, or CSV supported</p>
        <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.csv" onchange="handleFileUpload(event)">
      </div>

      <form id="deliveryForm" onsubmit="event.preventDefault(); handleAddOrder();">
        <label>PO / Invoice Number</label>
        <input type="text" id="poNumber" placeholder="PO-1001" required>

        <label>Customer Name</label>
        <input type="text" id="customerName" placeholder="Client / Store Name" required>

        <label>Destination Address</label>
        <input type="text" id="deliveryAddress" placeholder="Street, City, State, ZIP" required>

        <label>Cargo Dimensions (Inches)</label>
        <div class="dims-grid">
          <input type="number" id="dimL" placeholder="L (68 max)" step="any" oninput="auditIoniqLimits()" required>
          <input type="number" id="dimW" placeholder="W (41 max)" step="any" oninput="auditIoniqLimits()" required>
          <input type="number" id="dimH" placeholder="H (26 max)" step="any" oninput="auditIoniqLimits()" required>
        </div>
        <div id="dimAlert" class="alert alert-danger">
          ⚠️ OVERSIZE (Exceeds IONIQ 5 bed: 68"L × 41"W × 26"H, 59.3 cu ft)
        </div>

        <label>Special Instructions / Notes</label>
        <textarea id="itemsDesc" rows="2" placeholder="Gate codes, delivery contact..."></textarea>

        <button type="submit" class="btn">Dispatch to Driver Phone</button>
      </form>
      <div id="intakeAlert" class="alert alert-success"></div>
    </aside>

    <!-- Right Section: Fleet Live Monitor -->
    <main class="content-queue">
      <div class="queue-header">
        <div>
          <h2 class="queue-title">Active Fleet Monitor</h2>
          <span style="font-size: 0.85rem; color: var(--muted);">Real-time status tracking and Proof of Delivery review</span>
        </div>
        <div class="toolbar">
          <button class="btn-export" onclick="exportDailyManifest()">📊 Export Manifest</button>
          <button class="btn-pdf-all" onclick="exportAllInvoicesPDF()">📄 Download PO Invoices (PDF)</button>
          <button class="btn-clear" style="background:#1e3a8a;color:#93c5fd;" onclick="openRestore()">↩️ Restore (<span id="tCnt">0</span>)</button>
          <button class="btn-clear" onclick="clearCompletedDeliveries()">🗑️ Clear Completed</button>
        </div>
      </div>

      <div id="orders-list" class="orders-grid"></div>
    </main>
  </div>

  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCes7q2ekpluK_QBpcDPb6iaIxljDQZ5dY",
      authDomain: "borray-delivery-dispatch.firebaseapp.com",
      projectId: "borray-delivery-dispatch",
      storageBucket: "borray-delivery-dispatch.firebasestorage.app",
      messagingSenderId: "385282448736",
      appId: "1:385282448736:web:a8e60e605c20c0a7229205",
      measurementId: "G-N1TG2E7RMB"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const IONIQ5_LIMITS = { maxL: 68, maxW: 41, maxH: 26, maxCuFt: 59.3 };
    let currentOrders = [];

    function resolvePdfLib() {
      if (window.pdfjsLib) return window.pdfjsLib;
      if (window['pdfjs-dist/build/pdf']) return window['pdfjs-dist/build/pdf'];
      if (window.PDFJS) return window.PDFJS;
      return null;
    }

    function checkIsOversize(l, w, h) {
      const cuFt = (l * w * h) / 1728;
      return (l > IONIQ5_LIMITS.maxL || w > IONIQ5_LIMITS.maxW || h > IONIQ5_LIMITS.maxH || cuFt > IONIQ5_LIMITS.maxCuFt);
    }

    window.auditIoniqLimits = function() {
      const l = parseFloat(document.getElementById('dimL').value) || 0;
      const w = parseFloat(document.getElementById('dimW').value) || 0;
      const h = parseFloat(document.getElementById('dimH').value) || 0;
      const alertBox = document.getElementById('dimAlert');
      if (!l && !w && !h) {
        alertBox.style.display = 'none';
        return false;
      }
      const isOver = checkIsOversize(l, w, h);
      alertBox.style.display = isOver ? 'block' : 'none';
      return isOver;
    };

    // Intake Parsing
    window.handleFileUpload = async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const nameLower = file.name.toLowerCase();

      if (file.type === "application/pdf" || nameLower.endsWith('.pdf')) {
        let pdfLib = resolvePdfLib();
        if (!pdfLib) {
          await new Promise(r => setTimeout(r, 300));
          pdfLib = resolvePdfLib();
        }
        if (!pdfLib) {
          alert("PDF library is still initializing. Please select the file again.");
          return;
        }
        if (!pdfLib.GlobalWorkerOptions.workerSrc) {
          pdfLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
        }
        try {
          const buf = await file.arrayBuffer();
          const pdf = await pdfLib.getDocument({ data: new Uint8Array(buf) }).promise;
          let fullText = "";
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(it => it.str).join(" ") + " ";
          }
          extractFieldsFromText(fullText, file.name);
        } catch (err) {
          alert("Error parsing PDF: " + err.message);
        }
      } else if (nameLower.endsWith('.xlsx') || nameLower.endsWith('.xls') || nameLower.endsWith('.csv')) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const txt = XLSX.utils.sheet_to_txt(ws);
            extractFieldsFromText(txt, file.name);
          } catch (err) {
            alert("Error parsing spreadsheet: " + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      }
    };

    function extractFieldsFromText(text, filename) {
      let invMatch = text.match(/Invoice\s*([0-9]+(?:-[0-9]+)?)/i);
      let poMatch = text.match(/(?:P\.O\.?\s*NUMBER|PO|P\.O\.|Order)[\s#:*-]+([A-Za-z0-9-]+)/i);
      let finalPO = '';
      if (invMatch) finalPO = invMatch[1].trim();
      else if (poMatch && poMatch[1].trim().toUpperCase() !== 'NUMBER') finalPO = poMatch[1].trim();
      else finalPO = 'PO-' + Date.now().toString().slice(-6);

      let customerName = '';
      let deliveryAddress = '';

      const billToMatch = text.match(/BILL\s*TO[\s:]+([\s\S]+?)(?=\s+DATE|\s+PLEASE\s+PAY|\s+DUE\s+DATE|\s+CUSTOM|$)/i);
      if (billToMatch) {
        let block = billToMatch[1].trim();
        const addrRegex = /([0-9]+\s+[A-Za-z0-9\s,\.]+?(?:ROAD|RD|STREET|ST|AVE|AVENUE|BLVD|BOULEVARD|DR|DRIVE|LN|LANE|WAY|CT|COURT)[\s\S]*?[0-9]{5}(?:-[0-9]{4})?)/i;
        const addrFound = block.match(addrRegex);
        if (addrFound) {
          deliveryAddress = addrFound[1].replace(/\s+/g, ' ').trim();
          customerName = block.substring(0, addrFound.index).replace(/\s+/g, ' ').trim();
        } else {
          let parts = block.split(/\s{2,}/);
          customerName = parts[0] || '';
          deliveryAddress = parts.slice(1).join(' ').trim();
        }
      }

      let dimL = '', dimW = '', dimH = '';
      const dim3D = text.match(/(\d+(?:\.\d+)?)\s*["”]?\s*[xX*by\s]+\s*(\d+(?:\.\d+)?)\s*["”]?\s*[xX*by\s]+\s*(\d+(?:\.\d+)?)/i);
      const dim2D = text.match(/(\d+(?:\.\d+)?)\s*["”]?\s*[xX*by\s]+\s*(\d+(?:\.\d+)?)\s*["”]?/i);
      if (dim3D) { dimL = dim3D[1]; dimW = dim3D[2]; dimH = dim3D[3]; }
      else if (dim2D) { dimL = dim2D[1]; dimW = dim2D[2]; dimH = '12'; }

      if (document.getElementById('poNumber')) document.getElementById('poNumber').value = finalPO;
      if (document.getElementById('customerName')) document.getElementById('customerName').value = customerName;
      if (document.getElementById('deliveryAddress')) document.getElementById('deliveryAddress').value = deliveryAddress;
      if (document.getElementById('dimL')) document.getElementById('dimL').value = dimL;
      if (document.getElementById('dimW')) document.getElementById('dimW').value = dimW;
      if (document.getElementById('dimH')) document.getElementById('dimH').value = dimH;

      document.getElementById('itemsDesc').value = "Parsed from: " + filename;
      auditIoniqLimits();
    }

    // Save and Dispatch
    window.handleAddOrder = async function() {
      const l = parseFloat(document.getElementById('dimL').value) || 0;
      const w = parseFloat(document.getElementById('dimW').value) || 0;
      const h = parseFloat(document.getElementById('dimH').value) || 0;
      const cuFt = ((l * w * h) / 1728).toFixed(1);
      const orderId = 'ord_' + Date.now();

      const newOrder = {
        id: orderId,
        poNumber: document.getElementById('poNumber').value.trim(),
        customer: document.getElementById('customerName').value.trim(),
        destination: document.getElementById('deliveryAddress').value.trim(),
        length: l,
        width: w,
        height: h,
        cubicFt: cuFt,
        isOversize: checkIsOversize(l, w, h),
        status: 'Pending',
        photoData: null,
        signatureData: null,
        signerName: '',
        deliveredAt: null,
        notes: document.getElementById('itemsDesc').value.trim(),
        createdAt: new Date().toISOString()
      };

      await db.collection('orders').doc(orderId).set(newOrder);

      document.getElementById('deliveryForm').reset();
      document.getElementById('dimAlert').style.display = 'none';

      const alertBox = document.getElementById('intakeAlert');
      alertBox.textContent = "✓ Order " + newOrder.poNumber + " dispatched to driver.";
      alertBox.style.display = 'block';
      setTimeout(() => alertBox.style.display = 'none', 3000);
    };

    // Live Snapshot Listener
    function listenToOrders() {
      db.collection('orders').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
        currentOrders = [];
        snapshot.forEach(doc => currentOrders.push(doc.data()));

        const listEl = document.getElementById('orders-list');
        if (currentOrders.length === 0) {
          listEl.innerHTML = '<div style="color: var(--muted); grid-column: 1/-1;">No deliveries logged. Enter details on the left to dispatch.</div>';
          return;
        }

        listEl.innerHTML = currentOrders.map(ord => {
          const normStatus = ord.status.replace(/\s+/g, '').toLowerCase();
          let podSection = '';
          if (ord.status === 'Delivered') {
            podSection = 
              '<div class="pod-box">' +
                (ord.photoData ? '<img src="' + ord.photoData + '" alt="POD">' : '') +
                (ord.signatureData ? '<img src="' + ord.signatureData + '" alt="Sig" style="background:#fff;">' : '') +
                '<div style="font-size:0.75rem; color:var(--muted);">' +
                  'Received by: <strong>' + (ord.signerName || 'N/A') + '</strong><br>' +
                  new Date(ord.deliveredAt).toLocaleTimeString() +
                '</div>' +
              '</div>';
          }

          return (
            '<div class="order-card">' +
              '<div>' +
                '<div class="order-top">' +
                  '<strong style="font-size:1.1rem; color:#fff;">' + ord.poNumber + '</strong>' +
                  '<span class="badge badge-' + normStatus + '">' + ord.status + '</span>' +
                '</div>' +
                '<div style="color:var(--accent); font-weight:600; font-size:0.95rem;">' + ord.customer + '</div>' +
                '<p style="font-size:0.85rem; color:var(--text); margin-top:6px;">📍 ' + ord.destination + '</p>' +
                '<p style="font-size:0.8rem; color:var(--muted); margin-top:4px;">' +
                  ord.length + '"L × ' + ord.width + '"W × ' + ord.height + '"H (' + ord.cubicFt + ' cu ft)' +
                '</p>' +
                (ord.isOversize ? '<div class="badge badge-oversize">⚠️ OVERSIZE FOR IONIQ 5</div>' : '') +
                (ord.notes ? '<p style="font-size:0.8rem; color:var(--muted); margin-top:6px; font-style:italic;">Notes: ' + ord.notes + '</p>' : '') +
              '</div>' +
              podSection +
              '<div class="card-actions">' +
                '<button type="button" class="btn-sm btn-preview" onclick="generateInvoicePDF(\'' + ord.id + '\', true)">👁️ Preview PDF</button>' +
                '<button type="button" class="btn-sm btn-download-pdf" onclick="generateInvoicePDF(\'' + ord.id + '\', false)">⬇️ Save PDF</button>' +
                '<button type="button" class="btn-sm btn-delete" onclick="delOrd(\'' + ord.id + '\')">🗑️ Delete</button>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      });
    }

    function detectImageFormat(dataUrl) {
      if (!dataUrl || typeof dataUrl !== 'string') return 'PNG';
      if (dataUrl.startsWith('data:image/jpeg') || dataUrl.startsWith('data:image/jpg')) return 'JPEG';
      return 'PNG';
    }

    // Per-PO PDF Invoice Generator (Signature Bottom-Left, Drop-Off Photo Bottom-Right)
    window.generateInvoicePDF = function(orderId, previewOnly = false) {
      const ord = currentOrders.find(o => o.id === orderId);
      if (!ord) {
        alert("Order not found.");
        return;
      }
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("PDF generator is still loading. Please try again in a moment.");
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'letter' });

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.setTextColor(15, 23, 42);
      doc.text('Borray Mfg, Inc.', 15, 20);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor(71, 85, 105);
      doc.text('10620 Pioneer Blvd, Santa Fe Springs, CA 90670', 15, 26);
      doc.text('(714) 558-0564  |  info@borray.com  |  www.borray.com', 15, 31);

      doc.setFillColor(15, 23, 42);
      doc.rect(132, 13, 69, 24, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(56, 189, 248);
      doc.text('DELIVERY INVOICE / POD', 166.5, 20, { align: 'center' });
      doc.setFontSize(10);
      doc.setTextColor(255, 255, 255);
      doc.text('PO / Inv #: ' + (ord.poNumber || 'N/A'), 166.5, 27, { align: 'center' });
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.5);
      doc.text('Status: ' + (ord.status || 'Pending'), 166.5, 33, { align: 'center' });

      doc.setDrawColor(203, 213, 225);
      doc.line(15, 42, 201, 42);

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(15, 23, 42);
      doc.text('SHIP TO / CUSTOMER', 15, 51);
      doc.text('DELIVERY SUMMARY', 120, 51);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(30, 41, 59);
      const custLines = doc.splitTextToSize(ord.customer || 'N/A', 95);
      doc.text(custLines, 15, 58);

      const destLines = doc.splitTextToSize(ord.destination || 'N/A', 95);
      doc.text(destLines, 15, 58 + custLines.length * 5 + 1);

      const dateStr = ord.deliveredAt
        ? new Date(ord.deliveredAt).toLocaleString()
        : (ord.createdAt ? new Date(ord.createdAt).toLocaleDateString() : new Date().toLocaleDateString());
      doc.text('Date: ' + dateStr, 120, 58);
      doc.text('Vehicle: 2022 Hyundai IONIQ 5', 120, 64);
      doc.text('Dimensions: ' + ord.length + '"L x ' + ord.width + '"W x ' + ord.height + '"H', 120, 70);
      doc.text('Volume: ' + ord.cubicFt + ' cu ft' + (ord.isOversize ? ' (OVERSIZE)' : ''), 120, 76);

      doc.setFillColor(241, 245, 249);
      doc.rect(15, 92, 186, 9, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      doc.setTextColor(15, 23, 42);
      doc.text('PO / INVOICE #', 18, 98);
      doc.text('CARGO & DELIVERY NOTES', 62, 98);
      doc.text('DIMENSIONS', 162, 98);

      doc.setDrawColor(203, 213, 225);
      doc.rect(15, 92, 186, 65);
      doc.line(15, 101, 201, 101);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(30, 41, 59);
      doc.text(String(ord.poNumber || 'N/A'), 18, 109);
      const notesLines = doc.splitTextToSize(ord.notes || 'Standard delivery', 94);
      doc.text(notesLines, 62, 109);
      doc.text(ord.length + '" x ' + ord.width + '" x ' + ord.height + '"', 162, 109);

      // Bottom-Left: Customer Signature
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      doc.setTextColor(15, 23, 42);
      doc.text('CUSTOMER SIGNATURE', 15, 186);
      doc.setDrawColor(148, 163, 184);
      doc.rect(15, 189, 88, 46);

      if (ord.signatureData) {
        try {
          doc.addImage(ord.signatureData, detectImageFormat(ord.signatureData), 18, 192, 82, 40, undefined, 'FAST');
        } catch (err) {
          doc.setFont('helvetica', 'italic');
          doc.setFontSize(9);
          doc.setTextColor(100, 116, 139);
          doc.text('Signature image unavailable', 59, 213, { align: 'center' });
        }
      } else {
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(9);
        doc.setTextColor(148, 163, 184);
        doc.text('Pending customer signature', 59, 213, { align: 'center' });
      }

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(51, 65, 85);
      doc.text('Signed By: ' + (ord.signerName || '________________________'), 15, 242);
      doc.text('Timestamp: ' + (ord.deliveredAt ? new Date(ord.deliveredAt).toLocaleString() : 'Pending'), 15, 248);

      // Bottom-Right: Drop-Off Photo
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      doc.setTextColor(15, 23, 42);
      doc.text('DROP-OFF PHOTO', 113, 186);
      doc.setDrawColor(148, 163, 184);
      doc.rect(113, 189, 88, 46);

      if (ord.photoData) {
        try {
          doc.addImage(ord.photoData, detectImageFormat(ord.photoData), 116, 192, 82, 40, undefined, 'FAST');
        } catch (err) {
          doc.setFont('helvetica', 'italic');
          doc.setFontSize(9);
          doc.setTextColor(100, 116, 139);
          doc.text('Drop-off photo unavailable', 157, 213, { align: 'center' });
        }
      } else {
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(9);
        doc.setTextColor(148, 163, 184);
        doc.text('Pending drop-off photo', 157, 213, { align: 'center' });
      }

      // Footer
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(148, 163, 184);
      doc.text('Borray Manufacturing • Dispatch & Proof of Delivery Record', 108, 270, { align: 'center' });

      const cleanPO = (ord.poNumber || ord.id).replace(/[^a-zA-Z0-9_-]/g, '_');
      if (previewOnly) {
        window.open(doc.output('bloburl'), '_blank');
      } else {
        doc.save('Invoice_' + cleanPO + '.pdf');
      }
    };

    // Batch Export All Active PO Invoices into a Single Multi-Page PDF
    window.exportAllInvoicesPDF = function() {
      if (!currentOrders || currentOrders.length === 0) {
        alert("No active orders to export.");
        return;
      }
      currentOrders.forEach(ord => {
        window.generateInvoicePDF(ord.id, false);
      });
    };

    window.delOrd = async function(id) {
      if (!confirm("Move this order to trash?")) return;
      await db.collection('orders').doc(id).delete();
    };

    window.exportManifestCSV = function() {
      if (!currentOrders.length) return alert("No orders to export.");
      const headers = ['PO_Number','Customer','Destination','Length','Width','Height','CubicFt','Status','Signer','DeliveredAt'];
      const rows = currentOrders.map(o => [
        '"' + (o.poNumber || '') + '"',
        '"' + (o.customer || '').replace(/"/g, '""') + '"',
        '"' + (o.destination || '').replace(/"/g, '""') + '"',
        o.length || 0, o.width || 0, o.height || 0, o.cubicFt || 0,
        '"' + (o.status || '') + '"',
        '"' + (o.signerName || '') + '"',
        '"' + (o.deliveredAt || '') + '"'
      ].join(','));
      const blob = new Blob([[headers.join(','), ...rows].join('\n')], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Dispatch_Manifest_' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
    };

    window.clearCompletedDeliveries = async function() {
      if (!confirm("Clear all delivered orders from the active fleet screen?")) return;
      const batch = db.batch();
      currentOrders.forEach(o => {
        if (o.status === 'Delivered') {
          batch.delete(db.collection('orders').doc(o.id));
        }
      });
      await batch.commit();
    };

    window.addEventListener('DOMContentLoaded', listenToOrders);
  </script>
  <script src="trash.js"></script>
</body>
</html>
